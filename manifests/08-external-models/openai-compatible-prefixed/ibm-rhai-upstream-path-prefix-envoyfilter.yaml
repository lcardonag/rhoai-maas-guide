# IBM RHAI upstream path prefix for OpenShift Gateway (Istio Envoy).
# BBR/payload-processing normalizes :path to /v1/chat/completions and drops
# /v1/projects/<uuid>/inference. Route RequestHeaderModifier headers and
# host_rewrite are applied at router time, so a Lua filter after ext_proc.bbr
# must NOT rely on Host or x-ibm-rhai-prefix.
#
# Detection uses (in order): x-ibm-rhai-prefix if present, Host containing
# rhai.ibm.com, streamInfo:routeName(), X-Gateway-Model-Name, and
# :path / x-envoy-original-path containing /llm/<ibm-model>/.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: ibm-rhai-upstream-path-prefix
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/name: compact-maas
    compact-maas/managed: "true"
spec:
  priority: 95
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: maas-default-gateway
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
            subFilter:
              name: envoy.filters.http.ext_proc.bbr
    patch:
      operation: INSERT_AFTER
      value:
        name: envoy.lua.ibm-rhai-path-prefix
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
          defaultSourceCode:
            inlineString: |
              function envoy_on_request(handle)
                local headers = handle:headers()
                local prefix = "/v1/projects/002d4a39-9d40-4c25-a9fa-a603eebdb574/inference"
                local models = {
                  "llama-3-3-70b-instruct",
                  "granite-4-0-h-small",
                  "granite-4-1-30b",
                  "gemma-4-31b-it",
                  "mistral-small-3-2-24b-instruct-2506",
                  "nvidia-nemotron-3-nano-30b-a3b-fp8"
                }

                local function is_ibm(s)
                  if s == nil or s == "" then return false end
                  for i = 1, #models do
                    local m = models[i]
                    if s == m or string.find(s, m, 1, true) then
                      return true
                    end
                  end
                  return false
                end

                local function want_ibm()
                  local p = headers:get("x-ibm-rhai-prefix")
                  if p ~= nil and p ~= "" then
                    prefix = p
                    return true
                  end
                  local host = headers:get("host") or headers:get(":authority") or ""
                  if string.find(host, "rhai.ibm.com", 1, true) then
                    return true
                  end
                  local ok, rn = pcall(function() return handle:streamInfo():routeName() end)
                  if ok and is_ibm(rn) then
                    return true
                  end
                  if is_ibm(headers:get("x-gateway-model-name")) then
                    return true
                  end
                  if is_ibm(headers:get("X-Gateway-Model-Name")) then
                    return true
                  end
                  local op = headers:get("x-envoy-original-path") or ""
                  local path = headers:get(":path") or ""
                  if is_ibm(op) or is_ibm(path) then
                    return true
                  end
                  return false
                end

                if not want_ibm() then
                  return
                end

                local path = headers:get(":path") or ""
                if string.find(path, "/projects/", 1, true) then
                  return
                end

                -- Strip gateway /llm/<model> prefix if still present
                local rest = path
                for i = 1, #models do
                  local pat = "^/llm/" .. models[i] .. "/?"
                  rest = string.gsub(rest, pat, "/")
                end
                rest = string.gsub(rest, "^/+", "")
                if string.sub(rest, 1, 3) ~= "v1/" and rest ~= "v1" then
                  return
                end
                prefix = string.gsub(prefix, "/+$", "")
                headers:replace(":path", prefix .. "/" .. rest)
              end
