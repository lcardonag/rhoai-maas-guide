apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-billing-tier-templates
  namespace: maas-billing
  labels:
    app.kubernetes.io/part-of: maas-billing
    app.kubernetes.io/component: budget-enforcer
data:
  # Catalog profile: standard — four tiers per entity (same MaaSSubscription name, patched spec).
  # Replace model names/namespaces with your cluster catalog before enrollment goes live.
  standard.full.yaml: |
    modelRefs:
      - name: gemma-4-e4b-it
        namespace: llm
        tokenRateLimits:
          - limit: 100000
            window: 1m
  standard.throttled.yaml: |
    modelRefs:
      - name: gemma-4-e4b-it
        namespace: llm
        tokenRateLimits:
          - limit: 500
            window: 1m
  standard.free_only.yaml: |
    modelRefs:
      - name: gemma-4-e4b-it
        namespace: llm
        tokenRateLimits:
          - limit: 100
            window: 1m
  standard.exhausted.yaml: |
    modelRefs: []
