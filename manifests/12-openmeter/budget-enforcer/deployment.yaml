apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-enforcer
  namespace: maas-billing
  labels:
    app.kubernetes.io/name: budget-enforcer
    app.kubernetes.io/part-of: maas-billing
    maas-billing/backend: openmeter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: budget-enforcer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: budget-enforcer
        app.kubernetes.io/part-of: maas-billing
        maas-billing/backend: openmeter
    spec:
      serviceAccountName: maas-billing
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: enforcer
          image: maas-billing:latest
          imagePullPolicy: Always
          args: ["enforcer"]
          envFrom:
            - configMapRef:
                name: maas-billing-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
