apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-billing
  namespace: maas-billing
  labels:
    app.kubernetes.io/part-of: maas-billing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maas-billing-operator
  labels:
    app.kubernetes.io/part-of: maas-billing
rules:
  - apiGroups: ["maas.opendatahub.io"]
    resources:
      - maassubscriptions
      - maasauthpolicies
      - maasmodelrefs
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maas-billing-operator
  labels:
    app.kubernetes.io/part-of: maas-billing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: maas-billing-operator
subjects:
  - kind: ServiceAccount
    name: maas-billing
    namespace: maas-billing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maas-billing-metrics-reader
  labels:
    app.kubernetes.io/part-of: maas-billing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: maas-billing
    namespace: maas-billing
