apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-billing-api
  namespace: maas-billing
  labels:
    app.kubernetes.io/name: maas-billing-api
    app.kubernetes.io/part-of: maas-billing
    maas-billing/backend: openmeter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: maas-billing-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maas-billing-api
        app.kubernetes.io/part-of: maas-billing
        maas-billing/backend: openmeter
    spec:
      serviceAccountName: maas-billing
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: maas-billing:latest
          imagePullPolicy: Always
          args: ["api"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: maas-billing-config
          env:
            - name: OPENMETER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: maas-billing-secrets
                  key: OPENMETER_API_KEY
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maas-billing-api-data
